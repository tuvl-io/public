name: Deploy Portal to GitHub Pages

# Deploys the Vite-built React SPA at https://tuvl.io, with the compiled
# MkDocs site bundled in as a same-origin subpage at https://tuvl.io/docs.
#
# Flow:
#   1. checkout → pnpm install (frozen) → pnpm build → dist/
#   2. checkout tuvl-io/docs → mkdocs build → dist/docs/ (runs AFTER the vite
#      build, which empties dist/). tuvl.dev stays the versioned canonical
#      host; /docs is an unversioned same-origin mirror.
#   3. dist/ is uploaded as a Pages artefact (vite copies public/CNAME →
#      dist/CNAME automatically, which preserves the tuvl.io custom domain
#      on every deploy — GitHub Pages reads it from the artefact, not the
#      repo root)
#   4. deploy-pages publishes the artefact

on:
  push:
    branches: [release, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel an in-progress run when a newer push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (vite)
        # Output goes to ./dist; public/CNAME is copied to dist/CNAME by
        # vite so the custom domain survives every deploy.
        run: pnpm run build

      - name: Verify CNAME survived the build
        # Belt and braces: fail the build if the deployed artefact is
        # missing CNAME — would silently break tuvl.io.
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "::error::dist/CNAME is missing — public/CNAME must exist before build."
            exit 1
          fi
          printf '  ✓ dist/CNAME → '; cat dist/CNAME

      # --- Docs subpage: compile tuvl-io/docs into dist/docs ------------------
      # Must run AFTER the vite build, which empties dist/ on every run.
      - name: Checkout docs source
        uses: actions/checkout@v4
        with:
          repository: tuvl-io/docs
          # `release` is the deploy-gated branch that mirrors production docs
          # (see repo notes). Change here if the mirror should track a tag.
          ref: release
          path: docs-src
          # github.token can read tuvl-io/docs if it is public. If it is
          # private, add a repo-scoped PAT as the DOCS_CHECKOUT_TOKEN secret.
          token: ${{ secrets.DOCS_CHECKOUT_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs (MkDocs → dist/docs)
        # Plain mkdocs build (not mike): a flat, unversioned site with relative
        # links that resolves under /docs. Page canonicals still point at
        # tuvl.dev, so the mirror is not indexed as duplicate content.
        working-directory: docs-src
        run: |
          uv sync
          uv run mkdocs build --site-dir "$GITHUB_WORKSPACE/dist/docs"
          if [ ! -f "$GITHUB_WORKSPACE/dist/docs/index.html" ]; then
            echo "::error::dist/docs/index.html missing — docs build produced no output."
            exit 1
          fi
          printf '  ✓ docs built → dist/docs/ ('; \
            find "$GITHUB_WORKSPACE/dist/docs" -type f | wc -l | tr -d ' '; \
            printf ' files)\n'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
